[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "verifiable-delay-function-vdf"
version = "2.0.0"
description = "Pietrzak / Wesolowski Verifiable Delay Function (VDF) Evaluation Engine"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security/Cryptography",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = []

[project.scripts]
verifiable-delay-function-vdf = "vdf_engine.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/verifiable-delay-function-vdf"
Repository = "https://github.com/abusuraihsakhri/verifiable-delay-function-vdf.git"
