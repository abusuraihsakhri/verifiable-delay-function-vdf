name: Test and security checks

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install package and test dependencies
        run: python -m pip install -e ".[server,dev]"
      - name: Compile Python source
        run: python -m compileall -q agents vdf_engine cli.py simulator.py enrichment.py
      - name: Run Python regression tests
        run: python -m pytest -q
      - name: Check JavaScript syntax and browser algorithm
        run: |
          node --check web/vdf.js
          node --test tests/test_browser_vdf.cjs
